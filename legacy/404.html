<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Sector Not Found | Hive</title>
  <link rel="icon" type="image/png" href="logohive.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070709;
      --card: rgba(14, 14, 18, 0.88);
      --accent: #F2C14E;
      --orange: #F97316;
      --text: #F3F4F6;
      --text-dim: #9CA3AF;
      --border: rgba(242, 193, 78, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--text);
    }
    #dither-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }
    canvas#dither-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .dither-overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background-image: linear-gradient(135deg, transparent 15%, #F2C14E 40%, #F97316 65%, transparent 90%);
      -webkit-mask-image: radial-gradient(circle, #000 1.2px, transparent 1.4px);
      mask-image: radial-gradient(circle, #000 1.2px, transparent 1.4px);
      -webkit-mask-size: 7px 7px;
      mask-size: 7px 7px;
      opacity: 0.35;
      z-index: 2;
    }
    .vignette {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 72% 50%, transparent 22%, rgba(7, 7, 9, 0.4) 62%, #070709 95%);
      z-index: 3;
    }
    .page-layout {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 0 6vw;
      pointer-events: none;
    }
    .content-card {
      pointer-events: auto;
      max-width: 460px;
      width: 100%;
      padding: 44px 38px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(242, 193, 78, 0.12);
      text-align: left;
    }
    .brand-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #FFF;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(242, 193, 78, 0.35);
      background: rgba(242, 193, 78, 0.08);
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(242, 193, 78, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(242, 193, 78, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(242, 193, 78, 0); }
    }
    h1.code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 82px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -3px;
      margin-bottom: 8px;
      color: #FFF;
    }
    h1.code span { color: var(--accent); text-shadow: 0 0 30px rgba(242, 193, 78, 0.45); }
    h2.title {
      font-size: 22px;
      font-weight: 700;
      color: #F9FAFB;
      margin-bottom: 12px;
    }
    p.desc {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text-dim);
      margin-bottom: 30px;
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      flex: 1;
      padding: 13px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.18s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text);
    }
    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .btn-primary {
      background: var(--accent);
      border: none;
      color: #070709;
      box-shadow: 0 4px 18px rgba(242, 193, 78, 0.35);
    }
    .btn-primary:hover {
      background: #dfaf3e;
      transform: translateY(-1px);
    }
    .warp-hint {
      margin-top: 22px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #71717A;
    }

    @media (max-width: 900px) {
      .page-layout {
        justify-content: center;
        padding: 24px;
      }
      .content-card {
        text-align: center;
      }
      .actions {
        justify-content: center;
      }
      .vignette {
        background: radial-gradient(circle at center, rgba(7, 7, 9, 0.6) 20%, #070709 90%);
      }
    }
  </style>

<body>
  <div id="dither-container">
    <div class="dither-overlay"></div>
    <div class="vignette"></div>
    <canvas id="dither-canvas"></canvas>
  </div>

  <div class="page-layout">
    <div class="content-card">
      <div class="brand-heading">
        <span class="brand-title">H I V E</span>
      </div>
      <div class="badge">
        <span class="pulse-dot"></span>
        HIVE 404 · SECTOR DISCONNECTED
      </div>
      <h1 class="code">4<span>0</span>4</h1>
      <h2 class="title">Lost in Deep Space</h2>
      <p class="desc">The route or resource you are looking for has disconnected from the Hive swarm or does not exist on hivetools.pro.</p>
      <div class="actions">
        <button onclick="window.history.back()" class="btn btn-ghost">← Return</button>
        <a href="/" class="btn btn-primary">Return to Hive</a>
      </div>
      <div class="warp-hint">Move cursor to warp the Hive logo dither field</div>
    </div>
  </div>

  <script>
    (function() {
      const canvas = document.getElementById('dither-canvas');
      const gl = canvas.getContext('webgl2', { alpha: false, antialias: false });
      if (!gl) return;

      const FC = 80, FR = 60, FN = FC * FR, CC = 110;
      const EDGE_LO = 36, EDGE_HI = 130;
      const EDGES = [".", ":", "*", "+", "x"];
      const BRIGHTS = [..."HIVE404#@%&"];
      const ALL_CHARS = [...EDGES, ...BRIGHTS];
      const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
      const TM = 72, TL = 320, TS = 10;
      const TRAIL_CFG = { fb: 0.08, fss: 18, ffm: 0.15, fir: 0.8, firl: 1.0 };

      const VS = `#version 300 es
      in vec2 a_pos;
      void main(){ gl_Position = vec4(a_pos, 0, 1); }`;

      const FS = `#version 300 es
      precision highp float;
      uniform sampler2D uVideo, uFluid, uAtlas;
      uniform vec2 uRes;
      uniform int uPhase, uTrailN;
      uniform vec4 uTP[${TM}];
      uniform float uTL[${TM}];
      out vec4 O;
      const float CC = ${CC}.0, FC = ${FC}.0, FR = ${FR}.0;
      const float EL = ${EDGE_LO}.0, EH = ${EDGE_HI}.0;
      const int BAYER[16] = int[16](${BAYER.map(v => Math.round((v / 16) * 255)).join(",")});
      const int CHAR_N = ${ALL_CHARS.length};
      void main(){
        float cw = uRes.x / CC;
        float rows = ceil(uRes.y / cw) + 1.0;
        float gx = floor(gl_FragCoord.x / cw);
        float gy = floor((uRes.y - gl_FragCoord.y) / cw);
        if(gx >= CC || gy >= rows) discard;
        vec2 cp = vec2(fract(gl_FragCoord.x / cw), fract((uRes.y - gl_FragCoord.y) / cw));
        vec2 bp = vec2((gx + 0.5) * cw, (gy + 0.5) * cw);
        ivec2 fc = ivec2(gx / CC * FC, gy / rows * FR);
        fc = clamp(fc, ivec2(0), ivec2(int(FC)-1, int(FR)-1));
        vec2 flow = texelFetch(uFluid, fc, 0).rg;
        vec2 disp = vec2(0.0);
        for(int i = 0; i < uTrailN; i++){
          float life = uTL[i];
          if(life <= 0.0) continue;
          vec2 d = bp - uTP[i].xy;
          float dist = length(d);
          float r = 5.0 + life * 3.0;
          if(dist == 0.0 || dist > r) continue;
          float f = pow(1.0 - dist / r, 2.0);
          disp += (d / dist) * f * life * 3.0 + uTP[i].zw * f * 0.04;
        }
        vec2 sp = bp + disp + flow * 6.0;
        vec2 uv = clamp(sp / uRes, 0.0, 1.0);
        vec3 vc = texture(uVideo, uv).rgb;
        float signal = max(vc.r, max(vc.g, vc.b));
        float bg = smoothstep(0.035, 0.7, signal) * 255.0;
        float hm = min(1.0, length(flow) * 1.1);
        float gray = bg * (1.0 - hm) + (255.0 - bg) * hm;
        float thr = float(BAYER[(int(gy) & 3) * 4 + (int(gx) & 3)]);
        bool invDark = hm > 0.05 && bg > thr && gray <= thr;
        bool lit = gray > thr;
        if(!lit && !invDark) discard;
        float pg = invDark ? bg : gray;
        int ci;
        if(pg >= EL && pg <= EH) ci = uPhase % 5;
        else if(pg > EH) ci = 5 + uPhase % ${BRIGHTS.length};
        else discard;
        float au = (float(ci) + cp.x) / float(CHAR_N);
        float ca = texture(uAtlas, vec2(au, cp.y)).a;
        if(ca < 0.05) discard;
        vec3 amber = vec3(0.95, 0.76, 0.31);
        vec3 orange = vec3(0.98, 0.45, 0.09);
        vec3 gold = vec3(1.0, 0.85, 0.4);
        float tint = smoothstep(0.15, 0.9, uv.x * 0.6 + uv.y * 0.4);
        vec3 col = mix(amber, orange, tint);
        col = mix(col, gold, hm * 0.65);
        float a = (invDark ? 0.85 : 1.0) * ca;
        O = vec4(col * a, a);
      }`;

      function createFluid() {
        const vx = new Float32Array(FN), vy = new Float32Array(FN);
        const vx0 = new Float32Array(FN), vy0 = new Float32Array(FN);
        const p = new Float32Array(FN), div = new Float32Array(FN);
        const fi = (x, y) => Math.max(0, Math.min(FR - 1, y)) * FC + Math.max(0, Math.min(FC - 1, x));
        const bnd = (b, a) => {
          for (let x = 1; x < FC - 1; x++) {
            a[fi(x, 0)] = b === 2 ? -a[fi(x, 1)] : a[fi(x, 1)];
            a[fi(x, FR - 1)] = b === 2 ? -a[fi(x, FR - 2)] : a[fi(x, FR - 2)];
          }
          for (let y = 1; y < FR - 1; y++) {
            a[fi(0, y)] = b === 1 ? -a[fi(1, y)] : a[fi(1, y)];
            a[fi(FC - 1, y)] = b === 1 ? -a[fi(FC - 2, y)] : a[fi(FC - 2, y)];
          }
        };
        const diffuse = (b, d, s, diff, dt) => {
          const a = dt * diff * FN;
          for (let k = 0; k < 4; k++) {
            for (let y = 1; y < FR - 1; y++) {
              for (let x = 1; x < FC - 1; x++) {
                const i = fi(x, y);
                d[i] = (s[i] + a * (d[fi(x - 1, y)] + d[fi(x + 1, y)] + d[fi(x, y - 1)] + d[fi(x, y + 1)])) / (1 + 4 * a);
              }
            }
            bnd(b, d);
          }
        };
        const advect = (b, d, d0, u, v, dt) => {
          const dt0 = dt * Math.min(FC, FR);
          for (let y = 1; y < FR - 1; y++) {
            for (let x = 1; x < FC - 1; x++) {
              let nx = x - dt0 * u[fi(x, y)];
              let ny = y - dt0 * v[fi(x, y)];
              nx = Math.max(0.5, Math.min(FC - 1.5, nx));
              ny = Math.max(0.5, Math.min(FR - 1.5, ny));
              const i0 = Math.floor(nx), i1 = i0 + 1;
              const j0 = Math.floor(ny), j1 = j0 + 1;
              const s1 = nx - i0, s0 = 1 - s1;
              const t1 = ny - j0, t0 = 1 - t1;
              d[fi(x, y)] = s0 * (t0 * d0[fi(i0, j0)] + t1 * d0[fi(i0, j1)]) + s1 * (t0 * d0[fi(i1, j0)] + t1 * d0[fi(i1, j1)]);
            }
          }
          bnd(b, d);
        };
        const project = () => {
          for (let y = 1; y < FR - 1; y++) {
            for (let x = 1; x < FC - 1; x++) {
              div[fi(x, y)] = -0.5 * (vx[fi(x + 1, y)] - vx[fi(x - 1, y)] + vy[fi(x, y + 1)] - vy[fi(x, y - 1)]) / Math.max(FC, FR);
              p[fi(x, y)] = 0;
            }
          }
          bnd(0, div); bnd(0, p);
          for (let k = 0; k < 6; k++) {
            for (let y = 1; y < FR - 1; y++) {
              for (let x = 1; x < FC - 1; x++) {
                p[fi(x, y)] = (div[fi(x, y)] + p[fi(x - 1, y)] + p[fi(x + 1, y)] + p[fi(x, y - 1)] + p[fi(x, y + 1)]) / 4;
              }
            }
            bnd(0, p);
          }
          for (let y = 1; y < FR - 1; y++) {
            for (let x = 1; x < FC - 1; x++) {
              vx[fi(x, y)] -= 0.5 * (p[fi(x + 1, y)] - p[fi(x - 1, y)]) * FC;
              vy[fi(x, y)] -= 0.5 * (p[fi(x, y + 1)] - p[fi(x, y - 1)]) * FR;
            }
          }
          bnd(1, vx); bnd(2, vy);
        };
        return {
          vx, vy, fi,
          step(dt = 0.08) {
            for (let i = 0; i < FN; i++) { vx[i] *= 0.985; vy[i] *= 0.985; }
            vx0.set(vx); vy0.set(vy);
            diffuse(1, vx, vx0, 0.0001, dt);
            diffuse(2, vy, vy0, 0.0001, dt);
            project();
            vx0.set(vx); vy0.set(vy);
            advect(1, vx, vx0, vx0, vy0, dt);
            advect(2, vy, vy0, vx0, vy0, dt);
            project();
          }
        };
      }

      function mkShader(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      }
      const prog = gl.createProgram();
      gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const aPos = gl.getAttribLocation(prog, "a_pos");
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      function mkTex(unit) {
        const tex = gl.createTexture();
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        return tex;
      }
      const videoTex = mkTex(0);
      const fluidTex = mkTex(1);

      const atlasCanvas = document.createElement("canvas");
      const CELL = 64;
      atlasCanvas.width = CELL * ALL_CHARS.length;
      atlasCanvas.height = CELL;
      const actx = atlasCanvas.getContext("2d");
      actx.font = `${CELL * 0.92}px monospace`;
      actx.textAlign = "center";
      actx.textBaseline = "middle";
      actx.fillStyle = "#fff";
      ALL_CHARS.forEach((char, i) => actx.fillText(char, CELL * (i + 0.5), CELL * 0.5));
      mkTex(2);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, atlasCanvas);

      const loc = n => gl.getUniformLocation(prog, n);
      gl.uniform1i(loc("uVideo"), 0);
      gl.uniform1i(loc("uFluid"), 1);
      gl.uniform1i(loc("uAtlas"), 2);

      const fluid = createFluid();
      const fluidData = new Float32Array(FN * 2);
      const mouse = { x: -9999, y: -9999, vx: 0, vy: 0 };
      const trail = [];
      const now = () => performance.now();

      window.addEventListener('pointermove', e => {
        const rect = canvas.getBoundingClientRect();
        const px = mouse.x, py = mouse.y;
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
        mouse.vx = mouse.x - px;
        mouse.vy = mouse.y - py;
        if (px < 0 || py < 0) {
          trail.unshift({ x: mouse.x, y: mouse.y, vx: 0, vy: 0, b: now() });
          if (trail.length > TM) trail.length = TM;
          return;
        }
        const d = Math.hypot(mouse.vx, mouse.vy);
        if (d < 0.5) return;
        const steps = Math.max(1, Math.ceil(d / TS));
        const birth = now();
        for (let s = 1; s <= steps; s++) {
          const t = s / steps;
          trail.unshift({ x: px + mouse.vx * t, y: py + mouse.vy * t, vx: mouse.vx / steps, vy: mouse.vy / steps, b: birth });
          if (trail.length > TM) trail.length = TM;
        }
      });
      window.addEventListener('pointerleave', () => { mouse.x = mouse.y = -9999; });

      let W = 1, H = 1;
      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        gl.viewport(0, 0, W, H);
      }
      window.addEventListener('resize', resize);
      resize();

      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

      const uTP = loc("uTP"), uTLoc = loc("uTL"), uRes = loc("uRes"), uPhase = loc("uPhase"), uTrailN = loc("uTrailN");
      const tpBuf = new Float32Array(TM * 4), tlBuf = new Float32Array(TM);

      const dynamicPattern = document.createElement("canvas");
      const dpCtx = dynamicPattern.getContext("2d");

      function loop() {
        const ts = now();
        const { fb, fss, ffm, fir, firl } = TRAIL_CFG;
        for (let i = trail.length - 1; i >= 0; i--) {
          const pt = trail[i];
          const age = ts - pt.b;
          if (age >= TL) { trail.splice(i, 1); continue; }
          const life = 1 - age / TL;
          const radius = fir + life * firl;
          const gr = Math.ceil(radius);
          const speed = Math.hypot(pt.vx, pt.vy);
          const force = (fb + Math.min(speed, fss) / fss) * life;
          const cx = ((pt.x / W) * FC) | 0, cy = ((pt.y / H) * FR) | 0;
          for (let dy = -gr; dy <= gr; dy++) for (let dx = -gr; dx <= gr; dx++) {
            const dist = Math.hypot(dx, dy);
            if (dist > radius) continue;
            const f = Math.pow(1 - dist / radius, 2);
            fluid.vx[fluid.fi(cx + dx, cy + dy)] += pt.vx * f * force * ffm;
            fluid.vy[fluid.fi(cx + dx, cy + dy)] += pt.vy * f * force * ffm;
          }
        }
        fluid.step();
        if (frame++ % 8 === 0) phase = (phase + 1) % 255;

        // Match internal dynamicPattern resolution to viewport aspect ratio
        const dpW = 512;
        const dpH = Math.max(256, Math.round(dpW * (H / Math.max(1, W))));
        if (dynamicPattern.width !== dpW || dynamicPattern.height !== dpH) {
          dynamicPattern.width = dpW;
          dynamicPattern.height = dpH;
        }

        dpCtx.fillStyle = "#070709";
        dpCtx.fillRect(0, 0, dpW, dpH);

        // Position Hive Logo on the right side on desktop, center on narrow mobile
        const isDesktop = W > 900;
        const logoCenterX = isDesktop ? dpW * 0.70 : dpW * 0.5;
        const logoCenterY = dpH * 0.5;
        const offsetY = Math.sin(ts * 0.0018) * (dpH * 0.02);

        if (hiveLogoImg.complete && hiveLogoImg.naturalWidth > 0) {
          dpCtx.save();
          // Outer gold glow to diffuse character dithering outward around the logo
          const maxDim = Math.min(dpW, dpH);
          const glowRad = maxDim * 0.42;
          const glow = dpCtx.createRadialGradient(logoCenterX, logoCenterY + offsetY, maxDim * 0.08, logoCenterX, logoCenterY + offsetY, glowRad);
          glow.addColorStop(0, "rgba(242, 193, 78, 0.45)");
          glow.addColorStop(0.55, "rgba(249, 115, 22, 0.18)");
          glow.addColorStop(1, "transparent");
          dpCtx.fillStyle = glow;
          dpCtx.beginPath();
          dpCtx.arc(logoCenterX, logoCenterY + offsetY, glowRad, 0, Math.PI * 2);
          dpCtx.fill();

          // Render clean Hive logo symbol for ASCII/character matrix sampling
          const logoSize = maxDim * 0.64;
          dpCtx.drawImage(
            hiveLogoImg,
            logoCenterX - logoSize / 2,
            logoCenterY - logoSize / 2 + offsetY,
            logoSize,
            logoSize
          );
          dpCtx.restore();
        } else {
          // Fallback animated hexagon if image not yet loaded
          dpCtx.save();
          dpCtx.translate(logoCenterX, logoCenterY + offsetY);
          dpCtx.beginPath();
          for (let i = 0; i < 6; i++) {
            const angle = (i * Math.PI) / 3;
            const x = Math.cos(angle) * (dpH * 0.22);
            const y = Math.sin(angle) * (dpH * 0.22);
            if (i === 0) dpCtx.moveTo(x, y);
            else dpCtx.lineTo(x, y);
          }
          dpCtx.closePath();
          dpCtx.fillStyle = "#F2C14E";
          dpCtx.fill();
          dpCtx.restore();
        }

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, videoTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, dynamicPattern);

        for (let i = 0; i < FN; i++) {
          fluidData[i * 2] = fluid.vx[i];
          fluidData[i * 2 + 1] = fluid.vy[i];
        }
        gl.activeTexture(gl.TEXTURE1);
        gl.bindTexture(gl.TEXTURE_2D, fluidTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG32F, FC, FR, 0, gl.RG, gl.FLOAT, fluidData);

        tpBuf.fill(0); tlBuf.fill(0);
        for (let i = 0; i < trail.length; i++) {
          const pt = trail[i];
          tpBuf[i * 4] = pt.x;
          tpBuf[i * 4 + 1] = pt.y;
          tpBuf[i * 4 + 2] = pt.vx;
          tpBuf[i * 4 + 3] = pt.vy;
          tlBuf[i] = 1 - (ts - pt.b) / TL;
        }
        gl.uniform4fv(uTP, tpBuf);
        gl.uniform1fv(uTLoc, tlBuf);
        gl.uniform1i(uTrailN, trail.length);
        gl.uniform2f(uRes, W, H);
        gl.uniform1i(uPhase, phase);
        gl.clearColor(0.03, 0.03, 0.04, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>

<div class="wrap">

  <!-- ── Signed-out state: shown instead of redirecting away ── -->
  <div class="card gate" id="pf-gate" style="display:none;">
    <div class="gate-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>Sign in to view your profile</h1>
    <p class="gate-sub" id="pf-gate-sub">Your account and plan details live here.</p>
    <div class="btns" style="justify-content:center;">
      <a class="btn primary" href="/auth?next=/profile">Sign in</a>
      <a class="btn ghost" href="/auth?mode=signup&next=/profile">Create account</a>
    </div>
    <p class="gate-note">The public beta installer was removed. We’ll explain what changed when v0.0.1 is posted.</p>
  </div>

  <div class="card" id="pf-card" style="display:none;">
    <div class="who">
      <span class="av" id="pf-av">?</span>
      <div>
        <b id="pf-name">Loading…</b>
        <span id="pf-email"></span>
      </div>
    </div>
    <div class="meta">
      <span class="badge pending" id="pf-status">…</span>
      <span id="pf-since">—</span>
    </div>

    <div class="tiles">
      <div class="tile"><div class="k">Plan</div><div class="v dim" id="pf-plan">—</div></div>
      <div class="tile"><div class="k">Tokens used</div><div class="v dim" id="pf-quota">—</div></div>
    </div>


     <label for="pf-display">Display name</label>
     <input id="pf-display" type="text" placeholder="Your name" maxlength="40" />
     <label for="pf-notify" style="display:flex;align-items:center;gap:9px;margin:16px 0 4px;color:var(--text-dim);font-size:13px;cursor:pointer;">
       <input id="pf-notify" type="checkbox" />
       Email me about release updates
     </label>
     <div class="btns">
      <button class="btn primary" id="pf-save" type="button">Save name</button>
    </div>
    <p id="pf-msg"></p>

    <div class="btns">
      <a class="btn primary" href="/pricing">View monthly plans</a>
      <a class="btn ghost" href="/download">Hive v0.0.1 status</a>
      <a class="btn ghost" id="pf-admin-btn" href="/admin" style="display:none;border-color:var(--orange-35);color:var(--orange-hi);">Admin panel</a>
      <a class="btn ghost" href="/docs">Docs</a>
      <button class="btn danger" id="pf-out" type="button">Sign out</button>
    </div>
  </div>

  
</div>

<script>
(function () {
  var SB = window.hiveSupabase || null;

  function msg(t) { var el = document.getElementById('pf-msg'); if (el) el.textContent = t || ''; }
  function esc(s) { return String(s == null ? '' : s); }

  function show(id, on) { var el = document.getElementById(id); if (el) el.style.display = on ? 'block' : 'none'; }

  /* Never redirect away: render the signed-out state in place instead, so the page
     always works — including on a static host with no /auth route. */
  function showGate(reason) {
    show('pf-card', false);
    var gate = document.getElementById('pf-gate');
    if (gate) { gate.style.display = 'block'; gate.classList.add('in'); }
    if (reason) {
      var sub = document.getElementById('pf-gate-sub');
      if (sub) sub.textContent = reason;
    }
  }
  function showCard() {
    show('pf-gate', false);
    var card = document.getElementById('pf-card');
    if (card) { card.style.display = 'block'; card.classList.add('in'); }
  }

  async function load() {
    if (!SB) { showGate('Sign-in is unavailable right now — the account service did not load. Try again in a moment.'); return; }
    var s;
    try { s = await SB.auth.getSession(); } catch (e) { showGate('We could not reach the account service. Try again in a moment.'); return; }
    var user = s.data && s.data.session && s.data.session.user;
    if (!user) { showGate(); return; }
    showCard();

    document.getElementById('pf-email').textContent = user.email || '';
    document.getElementById('pf-av').textContent = ((user.email || '?').charAt(0) || '?').toUpperCase();

    var profile = null;
    try {
      var p = await SB.from('profiles').select('*').eq('id', user.id).maybeSingle();
      profile = p.data || null;
    } catch (e) {}

    var name = (profile && profile.display_name) || (user.email || '').split('@')[0];
    document.getElementById('pf-name').textContent = name;
     document.getElementById('pf-display').value = (profile && profile.display_name) || '';
     document.getElementById('pf-notify').checked = Boolean(profile && profile.release_updates_opted_in_at && profile.notify !== false);
    var isAdmin = Boolean((profile && (profile.is_admin === true || profile.is_admin === 'true')) || (user && user.email && /samkomedved/i.test(user.email)));
    show('pf-admin-btn', isAdmin);
    var st = ((profile && profile.status) || 'approved').toLowerCase();
    var badge = document.getElementById('pf-status');
    badge.textContent = st;
    badge.className = 'badge ' + (st === 'approved' ? 'approved' : (st === 'pending' ? 'pending' : st));
    document.getElementById('pf-since').textContent =
      'Member since ' + (((profile && profile.created_at) ? new Date(profile.created_at).toLocaleDateString() : 'today'));

    try {
      var sub = await SB.from('subscriptions').select('plan,status').eq('user_id', user.id).maybeSingle();
      document.getElementById('pf-plan').textContent =
        (sub.data && sub.data.status === 'active')
          ? ({ starter: 'Hive Starter', plus: 'Hive Plus', max: 'Hive Max' }[sub.data.plan] || 'Hive plan') + ' (active)'
          : 'Hive Free';
    } catch (e) {}

    try {
      var q = await SB.from('usage_quotas').select('used,token_limit').eq('user_id', user.id).maybeSingle();
      document.getElementById('pf-quota').textContent =
        (q.data) ? Number(q.data.used || 0).toLocaleString() + ' / ' + Number(q.data.token_limit || 0).toLocaleString() : '—';
    } catch (e) {}


    document.getElementById('pf-save').addEventListener('click', async function () {
       var v = document.getElementById('pf-display').value.trim();
       var notify = document.getElementById('pf-notify').checked;
       try {
         var r = await SB.from('profiles').upsert({
           id: user.id,
           email: user.email,
           display_name: v || null,
           notify: notify,
           release_updates_opted_in_at: notify ? new Date().toISOString() : null
         }, { onConflict: 'id' });
        if (r.error) { msg('Error: ' + r.error.message); return; }
        document.getElementById('pf-name').textContent = v || name;
        msg('Saved ✓');
      } catch (e) { msg('Error saving.'); }
    });
    document.getElementById('pf-out').addEventListener('click', async function () {
      try { await SB.auth.signOut(); } catch (e) {}
      window.location.href = '/';
    });
  }
  load();
})();
</script>


<script>
/* Hive shared chrome — scroll progress, back-to-top, scroll reveal, nav elevation.
   Guarded so it can sit on every page without double-binding. */
(function () {
  if (window.__hiveChrome) return;
  window.__hiveChrome = true;
  var prog = document.getElementById('scroll-progress');
  var toTop = document.getElementById('to-top');
  var nav = document.getElementById('site-nav');
  var ticking = false;
  function onScroll() {
    var h = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    var p = h > 0 ? (document.documentElement.scrollTop || 0) / h : 0;
    if (prog) { prog.style.transform = 'scaleX(' + p + ')'; prog.setAttribute('aria-valuenow', Math.round(p * 100)); }
    if (toTop) toTop.classList.toggle('show', p > 0.25);
    if (nav) nav.classList.toggle('scrolled', (document.documentElement.scrollTop || 0) > 12);
    ticking = false;
  }
  window.addEventListener('scroll', function () {
    if (!ticking) { requestAnimationFrame(onScroll); ticking = true; }
  }, { passive: true });
  onScroll();
  if (toTop) toTop.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });

  var els = document.querySelectorAll('.reveal');
  if (!els.length) return;
  if (!('IntersectionObserver' in window)) {
    els.forEach(function (el) { el.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { threshold: 0.12 });
  els.forEach(function (el) { io.observe(el); });
})();
</script>

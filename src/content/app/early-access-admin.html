<a href="#main" class="skip-link">Skip to main content</a>

<div class="wrap">
  <div class="crumb">
    <a href="/">← Hive</a>
  </div>

  <div id="gate" class="spotlight-card" style="background:var(--surface-2);border-color:var(--orange-35);">
    <h1 style="font-size:1.35rem;color:var(--orange);margin-bottom:6px;">Early access admin</h1>
    <p id="gate-text" style="font-size:13.5px;color:var(--dim);margin-bottom:16px;">Checking sign-in…</p>
    <p id="gate-link" style="display:none;margin-top:18px;"><a class="primary" href="/auth?next=/apis-hive-admin">Sign in</a></p>
  </div>

  <main id="main" style="display:none;" class="ea-main">
    <h2 style="font-size:1.25rem;margin-bottom:6px;">Early access</h2>
    <p class="hint">Grant accounts access by email. Create invite codes. Members see the installer on /download.</p>

    <section class="sec">
      <h3>Grant access</h3>
      <div class="row-actions" style="margin-top:0;">
        <input id="grant-email" type="email" placeholder="user@example.com" aria-label="Account email" style="flex:1;max-width:320px;" />
        <button class="primary" id="grant-btn" type="button">Grant access</button>
      </div>
    </section>

    <section class="sec">
      <h3>Create invite code</h3>
      <div class="row-actions" style="margin-top:0;">
        <input id="code-new" placeholder="Code (blank = auto)" aria-label="Code" style="flex:1;max-width:220px;" />
        <input id="code-note" placeholder="Note" aria-label="Note" style="flex:1;max-width:200px;" />
        <input id="code-max" type="number" min="1" value="1" aria-label="Max uses" style="max-width:90px;" />
        <button class="primary" id="code-btn" type="button">Create code</button>
      </div>
    </section>

    <section class="sec">
      <h3>Codes</h3>
      <div class="row-list" id="codes-list"><p class="hint">Loading…</p></div>
    </section>

    <section class="sec">
      <h3>Members</h3>
      <div class="row-list" id="members-list"><p class="hint">Loading…</p></div>
    </section>

    <p id="status" class="msg-line" role="status" aria-live="polite"></p>
  </main>
</div>

<script>
  (function () {
    var SB = window.hiveSupabase || null;
    var $ = function (id) { return document.getElementById(id); };
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
    var say = function (text, ok) { var el = $('status'); el.textContent = text; el.style.color = ok ? '#10B981' : ''; };
    var busy = function (btn, on, label) {
      if (on) { btn.dataset.idle = btn.textContent; btn.disabled = true; btn.textContent = label; }
      else { btn.disabled = false; btn.textContent = btn.dataset.idle || btn.textContent; }
    };

    async function init() {
      if (!SB) { $('gate-text').textContent = 'Supabase client not loaded. Reload the page.'; return; }
      var s = await SB.auth.getSession();
      if (!s.data || !s.data.session) {
        $('gate-text').textContent = 'Sign in with the owner account.';
        $('gate-link').style.display = 'block';
        return;
      }
      var admin = await SB.rpc('is_hive_admin');
      if (admin.error || admin.data !== true) {
        $('gate-text').textContent = 'This account does not have admin access.';
        $('gate-link').style.display = 'block';
        return;
      }
      $('gate').style.display = 'none';
      $('main').style.display = 'block';
      await loadAll();
    }

    async function loadAll() {
      await Promise.all([loadMembers(), loadCodes()]);
    }

    async function loadMembers() {
      var r = await SB.rpc('admin_list_early_access');
      if (r.error) { say('Members: ' + r.error.message); return; }
      var rows = r.data || [];
      $('members-list').innerHTML = rows.length ? rows.map(function (g) {
        return '<div class="row"><div class="who"><b>' + esc(g.email || g.user_id) + '</b>'
          + '<span>' + esc(g.source) + ' · ' + esc(new Date(g.granted_at).toLocaleString()) + '</span></div>'
          + '<div class="acts"><button class="btn ghost" type="button" data-revoke="' + esc(g.user_id) + '">Revoke</button></div></div>';
      }).join('') : '<p class="hint">No members yet.</p>';
    }

    async function loadCodes() {
      var r = await SB.rpc('admin_list_early_access_codes');
      if (r.error) { say('Codes: ' + r.error.message); return; }
      var rows = r.data || [];
      $('codes-list').innerHTML = rows.length ? rows.map(function (k) {
        return '<div class="row"><div class="who"><b style="font-family:monospace;">' + esc(k.code) + '</b>'
          + '<span>' + esc(k.note || 'no note') + ' · used ' + k.uses + ' / ' + k.max_uses + ' · ' + (k.active ? 'active' : 'disabled') + '</span></div>'
          + '<div class="acts"><button class="btn ghost" type="button" data-code="' + esc(k.code) + '" data-active="' + (!k.active) + '">' + (k.active ? 'Disable' : 'Enable') + '</button></div></div>';
      }).join('') : '<p class="hint">No codes yet.</p>';
    }

    $('grant-btn').addEventListener('click', async function () {
      var email = $('grant-email').value.trim();
      if (!email) { say('Enter an email.'); return; }
      busy(this, true, 'Granting…');
      var r = await SB.rpc('admin_grant_early_access', { p_email: email });
      busy(this, false);
      if (r.error) { say('Grant failed: ' + r.error.message); return; }
      $('grant-email').value = '';
      say('Access granted to ' + email + '.', true);
      await loadMembers();
    });

    $('code-btn').addEventListener('click', async function () {
      var max = Math.max(1, Number($('code-max').value) || 1);
      busy(this, true, 'Creating…');
      var r = await SB.rpc('admin_create_early_access_code', {
        p_code: $('code-new').value.trim(),
        p_note: $('code-note').value.trim(),
        p_max_uses: max
      });
      busy(this, false);
      if (r.error) { say('Create failed: ' + r.error.message); return; }
      $('code-new').value = '';
      $('code-note').value = '';
      say('Code ' + r.data + ' created.', true);
      await loadCodes();
    });

    $('members-list').addEventListener('click', async function (event) {
      var btn = event.target.closest('[data-revoke]');
      if (!btn || !confirm('Revoke early access for this account?')) return;
      var r = await SB.rpc('admin_revoke_early_access', { p_user_id: btn.dataset.revoke });
      if (r.error) { say('Revoke failed: ' + r.error.message); return; }
      say('Access revoked.', true);
      await loadMembers();
    });

    $('codes-list').addEventListener('click', async function (event) {
      var btn = event.target.closest('[data-code]');
      if (!btn) return;
      var active = btn.dataset.active === 'true';
      var r = await SB.rpc('admin_set_early_access_code_active', { p_code: btn.dataset.code, p_active: active });
      if (r.error) { say('Update failed: ' + r.error.message); return; }
      say('Code ' + btn.dataset.code + (active ? ' enabled.' : ' disabled.'), true);
      await loadCodes();
    });

    init();
  })();
</script>
